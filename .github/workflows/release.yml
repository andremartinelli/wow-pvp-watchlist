# Packages the addon and publishes it to GitHub Releases and CurseForge when a v* tag is pushed (e.g. v1.4.0).
# CurseForge only gets the file once ## X-Curse-Project-ID is in the .toc and the CF_API_KEY secret exists.
name: Release

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN is read-only by default; the packager needs write access to create the release.
permissions:
  contents: write

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: BigWigsMods/packager@v2
